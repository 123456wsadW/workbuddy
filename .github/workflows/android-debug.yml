name: Build WorkBuddy Assistant APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK metadata and checksum
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" > app/build/outputs/apk/debug/badging.txt
          grep -F "package: name='com.example.workbuddyassistant' versionCode='3' versionName='1.2.0'" app/build/outputs/apk/debug/badging.txt
          grep -F "sdkVersion:'23'" app/build/outputs/apk/debug/badging.txt
          grep -F "targetSdkVersion:'32'" app/build/outputs/apk/debug/badging.txt
          sha256sum "$APK" > "$APK.sha256"
          cat "$APK.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: WorkBuddyRegisterAssistant-1.2.0-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
